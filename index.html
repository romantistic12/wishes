<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Birthday Wish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div id="hearts-layer"></div>

  <main id="scene">

    <!-- Wax-seal opening gate -->
    <button id="seal" aria-label="Open your birthday wish">
      <span class="seal-ring"></span>
      <span class="seal-core">
        <span class="seal-letter">G</span>
      </span>
      <span class="seal-label">click to open</span>
    </button>

    <!-- The letter -->
    <section id="letter" aria-hidden="true">
      <div class="letter-frame">
        <p class="eyebrow">a small wish, made with care</p>
        <h1 class="title">Happy Birthday</h1>
        <div class="rule"></div>
        <p id="typed-text" class="wish-text"><span id="cursor" class="cursor">&nbsp;</span></p>
      </div>
    </section>

  </main>

  <button id="sound-toggle" aria-label="Toggle music">
    <span id="sound-icon">♪</span>
  </button>

  <script src="script.js"></script>
</body>
</html>
